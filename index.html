<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מבזקי חדשות - טלגרם בזמן אמת</title>
<meta name="description" content="מבזקי חדשות מטלגרם בזמן אמת">
<style>
  html, body { box-sizing: border-box; }
  *, *:before, *:after { box-sizing: inherit; }

  :root {
    --bg-color: #f8fafc; --text-color: #0f172a; --border-color: #e2e8f0;
    --card-bg: #ffffff; --header-bg: #ffffff; --primary: #3b82f6;
    --primary-hover: #2563eb; --muted-text: #64748b; --btn-bg: #ffffff;
    --btn-hover: #f1f5f9; --input-bg: #f8fafc;
  }

  body.dark-mode {
    --bg-color: #0f172a; --text-color: #f1f5f9; --border-color: #334155;
    --card-bg: #1e293b; --header-bg: #1e293b; --primary: #60a5fa;
    --primary-hover: #3b82f6; --muted-text: #94a3b8; --btn-bg: #1e293b;
    --btn-hover: #334155; --input-bg: #0f172a;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    margin: 0; padding: 0; min-height: 100vh;
    background-color: var(--bg-color); color: var(--text-color);
    transition: background-color 0.3s, color 0.3s;
  }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 20px; background-color: var(--header-bg);
    border-bottom: 1px solid var(--border-color);
    position: sticky; top: 0; z-index: 100;
  }
  .header h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #ef4444; transition: background .3s; flex-shrink:0; }
  .status-dot.live { background: #22c55e; box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.5);} 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0);} 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0);} }
  .header-actions { display: flex; gap: 6px; align-items: center; }

  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; padding: 0; border-radius: 8px;
    background: transparent; border: 1px solid var(--border-color);
    color: var(--muted-text); cursor: pointer; transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--btn-hover); color: var(--text-color); }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .spin { animation: spin 1s linear infinite; }

  #layout { display: flex; max-width: 1200px; margin: 0 auto; min-height: calc(100vh - 60px); }

  #sidebar {
    width: 240px; min-width: 240px; padding: 16px 10px;
    border-left: 1px solid var(--border-color);
  }
  #searchInput {
    width: 100%; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border-color);
    background: var(--input-bg); color: var(--text-color); font-size: 13px; margin-bottom: 12px;
    font-family: inherit;
  }
  .channel-btn-wrap {
      display: flex; align-items: center; border-radius: 8px; margin-bottom: 2px;
      transition: background 0.2s; cursor: pointer;
  }
  .channel-btn-wrap:hover { background-color: var(--btn-hover); }
  .channel-btn-wrap.active { background-color: var(--btn-hover); border-right: 4px solid var(--primary); }
  .channel-btn {
    flex: 1; padding: 10px 10px; border: none; background: transparent; text-align: right;
    font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text-color);
    cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    overflow: hidden; gap: 8px;
  }
  .channel-btn > span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-btn-wrap.active .channel-btn { color: var(--primary); }
  .badge { background-color: var(--border-color); color: var(--muted-text); font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: bold; }
  .channel-btn-wrap.active .badge { background-color: var(--primary); color: white; }

  #sidebarToggle { display: none; }

  .content-area { flex: 1; padding: 16px 20px; min-width: 0; }
  #messagesList { list-style: none; padding: 0; margin: 0; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  body.dark-mode ::-webkit-scrollbar-thumb { background: #475569; }

  .message-card {
    background: var(--card-bg); border: 1px solid var(--border-color);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
    transition: transform 0.15s, border-color 0.15s;
  }
  .message-card:hover { transform: translateY(-2px); border-color: var(--primary); }
  .message-source { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .message-source-name { font-weight: 700; color: var(--primary); font-size: 14px; }
  .message-time { color: var(--muted-text); font-weight: 500; font-size: 12px; }
  .message-title { font-size: 1.05em; display:block; margin-bottom: 5px; color: var(--text-color); font-weight: 700; }
  .message-text { font-size: 14.5px; color: var(--text-color); line-height: 1.65; word-wrap: break-word; white-space: pre-wrap; }
  .message-img { max-width: 100%; border-radius: 8px; margin-top: 10px; max-height: 320px; object-fit: cover; display: block; }
  .empty-state, .loading-state { text-align: center; color: var(--muted-text); font-size: 14px; padding: 80px 10px; font-weight: 500; }
  .offline-banner {
    background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 14px; text-align: center; display:none;
  }
  body.dark-mode .offline-banner { background: #451a1a; color: #fca5a5; border-color: #7f1d1d; }

  @media (max-width: 800px) {
    #layout { flex-direction: column; }
    #sidebar {
      width: 100%; min-width: 0; border-left: none; border-bottom: 1px solid var(--border-color);
      display: none;
    }
    #sidebar.open { display: block; }
    #sidebarToggle { display: flex; }
    .content-area { padding: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1><span class="status-dot" id="statusDot"></span> מבזקי חדשות</h1>
  <div class="header-actions">
    <button class="icon-btn" id="sidebarToggle" title="ערוצים">☰</button>
    <button class="icon-btn" id="refreshBtn" title="רענון">⟳</button>
    <button class="icon-btn" id="themeToggle" title="החלף מצב תצוגה">🌙</button>
  </div>
</div>

<div id="layout">
  <div id="sidebar">
    <input type="text" id="searchInput" placeholder="חיפוש ערוץ...">
    <div id="channelsList"></div>
  </div>

  <div class="content-area">
    <div class="offline-banner" id="offlineBanner">⚠️ אין חיבור לשרת. מנסה להתחבר מחדש...</div>
    <ul id="messagesList">
      <li class="loading-state">טוען הודעות...</li>
    </ul>
  </div>
</div>

<script>
const SERVER_URL = "https://chrome-extension-for-news-bu1y.onrender.com";
const MAX_MESSAGES = 300;

let allMessages = [];
let currentFilter = 'all';
let eventSource = null;
let reconnectDelay = 1000;
const MAX_RECONNECT_DELAY = 15000;

const messagesList = document.getElementById('messagesList');
const channelsList = document.getElementById('channelsList');
const statusDot = document.getElementById('statusDot');
const offlineBanner = document.getElementById('offlineBanner');
const searchInput = document.getElementById('searchInput');
const sidebar = document.getElementById('sidebar');

function escapeHTML(str) {
  if (!str) return '';
  return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
}

function linkify(text) {
  const urlRegex = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
  return text.replace(urlRegex, url => `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color: var(--primary); text-decoration: underline;">${url}</a>`);
}

function formatTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}

function setStatus(live) {
  statusDot.classList.toggle('live', live);
  offlineBanner.style.display = live ? 'none' : 'block';
}

function addMessage(item, atStart = true) {
  if (!item || allMessages.find(m => m.hash === item.hash)) return false;
  if (atStart) allMessages.unshift(item);
  else allMessages.push(item);
  if (allMessages.length > MAX_MESSAGES) allMessages.pop();
  return true;
}

function renderSidebar() {
  const counts = {};
  allMessages.forEach(m => { if (m.source) counts[m.source] = (counts[m.source] || 0) + 1; });
  const channels = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  const term = searchInput.value.trim().toLowerCase();

  let html = `
    <div class="channel-btn-wrap ${currentFilter === 'all' ? 'active' : ''}" data-channel="all">
      <button class="channel-btn"><span>כל המבזקים</span><span class="badge">${allMessages.length}</span></button>
    </div>`;

  channels.forEach(ch => {
    if (term && !ch.toLowerCase().includes(term)) return;
    html += `
      <div class="channel-btn-wrap ${currentFilter === ch ? 'active' : ''}" data-channel="${escapeHTML(ch)}">
        <button class="channel-btn"><span>${escapeHTML(ch)}</span><span class="badge">${counts[ch]}</span></button>
      </div>`;
  });

  channelsList.innerHTML = html;
  channelsList.querySelectorAll('.channel-btn-wrap').forEach(el => {
    el.addEventListener('click', () => {
      currentFilter = el.dataset.channel;
      sidebar.classList.remove('open');
      render();
    });
  });
}

function render() {
  renderSidebar();

  const list = currentFilter === 'all' ? allMessages : allMessages.filter(m => m.source === currentFilter);

  if (list.length === 0) {
    messagesList.innerHTML = '<li class="empty-state">אין הודעות להצגה כרגע.</li>';
    return;
  }

  messagesList.innerHTML = list.map(msg => {
    const titleHtml = msg.title && msg.title.trim()
      ? `<span class="message-title">${linkify(escapeHTML(msg.title))}</span>`
      : '';
    const bodyHtml = `<span>${linkify(escapeHTML(msg.content || ''))}</span>`;
    const imgHtml = msg.imageUrl ? `<img class="message-img" src="${msg.imageUrl}" loading="lazy" alt="">` : '';

    return `
      <li class="message-card">
        <div class="message-source">
          <span class="message-source-name">${escapeHTML(msg.source || '')}</span>
          <span class="message-time">${formatTime(msg.time)}</span>
        </div>
        <div class="message-text">${titleHtml}${bodyHtml}</div>
        ${imgHtml}
      </li>`;
  }).join('');
}

async function loadInitial() {
  try {
    const res = await fetch(SERVER_URL + '/');
    const data = await res.json();
    allMessages = Array.isArray(data) ? data.slice(0, MAX_MESSAGES) : [];
    allMessages.sort((a, b) => new Date(b.time) - new Date(a.time));
    render();
  } catch (e) {
    messagesList.innerHTML = '<li class="empty-state">לא ניתן היה לטעון הודעות מהשרת.</li>';
    setStatus(false);
  }
}

function connectSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(SERVER_URL + '/stream');

  eventSource.onopen = () => { setStatus(true); reconnectDelay = 1000; };

  eventSource.onmessage = (event) => {
    try {
      const message = JSON.parse(event.data);
      if (message.type === 'news' && addMessage(message.data, true)) {
        render();
      }
    } catch {}
  };

  eventSource.onerror = () => {
    if (eventSource && eventSource.readyState === EventSource.CONNECTING) return;
    setStatus(false);
    if (eventSource) { eventSource.close(); eventSource = null; }
    setTimeout(connectSSE, reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, MAX_RECONNECT_DELAY);
  };
}

document.getElementById('refreshBtn').addEventListener('click', function() {
  this.classList.add('spin');
  loadInitial().finally(() => setTimeout(() => this.classList.remove('spin'), 500));
});

document.getElementById('themeToggle').addEventListener('click', () => {
  const isDark = document.body.classList.toggle('dark-mode');
  document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('themeMode', isDark ? 'dark' : 'light');
});

document.getElementById('sidebarToggle').addEventListener('click', () => {
  sidebar.classList.toggle('open');
});

searchInput.addEventListener('input', renderSidebar);

(function initTheme() {
  const saved = localStorage.getItem('themeMode');
  const isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  if (isDark) {
    document.body.classList.add('dark-mode');
    document.getElementById('themeToggle').textContent = '☀️';
  }
})();

loadInitial().then(connectSSE);
</script>
</body>
</html>
